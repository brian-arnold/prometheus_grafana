# VictoriaMetrics single-node — long-term "forever" store for all GPU fleets
# (do-metrics-consolidation, 2026-07-23). Live data on the cold RBD block volume
# (ceph-block-cold); vmbackup sidecar snapshots daily to the cold RGW bucket
# (vm-lts-backup) via the vm-backup-s3 Secret. remote_write receive on :8428.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block-cold
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: monitoring
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: monitoring
  labels:
    app: victoria-metrics
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO volume — never two pods mounting at once
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000        # chowns the fresh ext4 RBD volume so VM can write
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.148.0
          args:
            - -storageDataPath=/vmdata
            - -retentionPeriod=100y          # effectively indefinite
            - -httpListenAddr=:8428
            - -dedup.minScrapeInterval=30s   # matches Mithril/at scrape interval
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: 2Gi }
            limits: { memory: 6Gi }
          volumeMounts:
            - name: data
              mountPath: /vmdata
        # vmbackup sidecar: shares /vmdata + reaches VM on localhost, so it can
        # create a snapshot and upload to the cold RGW bucket once a day.
        - name: vmbackup
          image: victoriametrics/vmbackup:v1.148.0
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                /vmbackup-prod \
                  -storageDataPath=/vmdata \
                  -snapshot.createURL=http://localhost:8428/snapshot/create \
                  -snapshot.deleteURL=http://localhost:8428/snapshot/delete \
                  -dst=s3://vm-lts-backup/vmsingle \
                  -customS3Endpoint=http://rook-ceph-rgw-cold.rook-ceph.svc:80 \
                  -s3ForcePathStyle=true || echo "vmbackup run failed, will retry next cycle";
                sleep 86400;
              done
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: vm-backup-s3, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: vm-backup-s3, key: AWS_SECRET_ACCESS_KEY } }
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /vmdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-metrics-data
