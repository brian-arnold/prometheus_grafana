apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    route:
      # default receiver: drop unmatched alerts (based on labels)
      receiver: 'null' 

      # How to group alerts together into a single notification.
      group_by: ['alertname']

      # group_wait: How long to wait after the first alert in a group arrives 
      # before sending a notification. This lets Alertmanager batch multiple alerts 
      # that fire around the same time into one message.
      group_wait: 30s

      # group_interval: How long to wait before sending updates about new alerts 
      # added to an existing group that already had a notification sent.
      group_interval: 5m

      # repeat_interval: How long to wait before re-sending a notification for an 
      # alert that's still firing and hasn't changed.
      repeat_interval: 3h 

      # for non-null receivers, define rule labels to route to them.
      # NOTE: routes are evaluated top-down and the first match wins (continue
      # defaults to false), so the dedicated burst route MUST come before the
      # generic severity routes — otherwise a burst alert (severity: warning)
      # would be caught by slack-warning-alerts instead.
      routes:
        - receiver: 'slack-it-alerts'
          match:
            alertname: BurstJobWhileReservationIdle
        - receiver: 'slack-info-alerts'
          match:
            severity: info
        - receiver: 'slack-warning-alerts'
          match:
            severity: warning
        - receiver: 'slack-critical-alerts'
          match:
            severity: critical

    # taken from default alertmanager config: inhibit rules when others already firing
    # e.g. If a critical alert is firing, suppress any warning/info alerts with 
    # the same namespace AND alertname. Rule labels should be set accordingly in 
    # PrometheusRules, e.g. severity of 'critical', 'warning', 'info'.
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'

    receivers:
      - name: 'null'

      # Dedicated channel for the "move burst jobs onto idle reservation capacity"
      # nudge. Uses <!channel> so everyone in #it-alerts is pinged.
      # UNLIKE the other receivers, this posts to the metamorphic-labs workspace
      # (not enigma-brain, where the alertmanager bot lives), so it uses a
      # metamorphic-labs Incoming Webhook instead of the chat.postMessage bot
      # token. The api_url below is a metamorphic-labs Incoming Webhook URL — a
      # secret that lives only in the live alertmanager-config secret. The
      # committed placeholder is filled in at apply time (see repo README).
      # NB: the webhook is bound to #it-alerts at creation time; the `channel`
      # field below is cosmetic (Slack ignores it and posts to the bound channel).
      - name: 'slack-it-alerts'
        slack_configs:
          - api_url: 'WEBHOOK_OMITTED'
            channel: '#it-alerts'
            send_resolved: true
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Burst GPU job(s) can move onto idle reservation capacity

            # <!channel> pings everyone in the channel. annotations/labels come from the PrometheusRule.
            text: >-
              <!channel> :money_with_wings: One or more *burst* GPU jobs are running while the
              reservation fleets (DigitalOcean + Mithril) have idle capacity to host them.
              Please move them off burst.

              {{ range .Alerts -}}
              *Job:* `{{ .Labels.run }}` — *user:* `{{ .Labels.user }}` — *fleet:* `{{ .Labels.fleet }}`

              {{ .Annotations.description }}
              {{ end }}

      - name: 'slack-info-alerts'
        slack_configs:
          - api_url: 'https://slack.com/api/chat.postMessage'
            channel: '#alertmanager-info'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: 'OMITTED'
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.job }}

            # annotations and labels come from the Prometheus rules
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.summary }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}

              *Description:* {{ .Annotations.description }}

              *Details:*
                {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                {{ end }}
              {{ end }}

      - name: 'slack-warning-alerts'
        slack_configs:
          - api_url: 'https://slack.com/api/chat.postMessage'
            channel: '#alertmanager-warning'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: 'OMITTED'
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.job }}

            # annotations and labels come from the Prometheus rules
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.summary }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}

              *Description:* {{ .Annotations.description }}

              *Details:*
                {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                {{ end }}
              {{ end }}

      - name: 'slack-critical-alerts'
        slack_configs:
          - api_url: 'https://slack.com/api/chat.postMessage'
            channel: '#alertmanager-critical'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: 'OMITTED'
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.job }}

            # annotations and labels come from the Prometheus rules
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.summary }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}

              *Description:* {{ .Annotations.description }}

              *Details:*
                {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                {{ end }}
              {{ end }}
