# Dashboards provisioned into mgmt-grafana (file provider, folder "Management").
# Add dashboards by appending files to this ConfigMap; grafana reloads every 30s.
# reserved-fleet-cost-do / -mithril: per-fleet cost dashboards (split per mgmt
# request 2026-07-29; the combined reserved-fleet-cost was replaced by these).
# Inputs per dashboard = TOTAL CONTRACT COST + CONTRACT LENGTH IN DAYS (textbox
# vars contract_cost / contract_days; plain numbers — no $ or commas). PromQL
# cannot parse typed dates, hence days rather than start/end fields; daily rate
# is derived as cost/days. Spend panels scale with the selected time range
# ($__range_s); utilized/idle split uses fleet-average DCGM GPU utilization.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mgmt-dashboards
  namespace: monitoring-mgmt
data:
  reserved-fleet-cost-do.json: "{\n  \"uid\": \"reserved-fleet-cost-do\",\n  \"title\": \"Reserved Fleet Cost \u2014 DigitalOcean\",\n  \"tags\": [\n    \"fleets\",\n    \"gpu\",\n    \"reserved\",\n    \"cost\",\n    \"management\"\n  ],\n  \"schemaVersion\": 39,\n  \"version\": 3,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-7d\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"type\": \"textbox\",\n        \"name\": \"contract_cost\",\n        \"label\": \"DigitalOcean contract cost ($ total)\",\n        \"query\": \"0\",\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"0\",\n          \"value\": \"0\"\n        },\n        \"options\": [\n          {\n            \"selected\": true,\n            \"text\": \"0\",\n            \"value\": \"0\"\n          }\n        ]\n      },\n      {\n        \"type\": \"textbox\",\n        \"name\": \"contract_days\",\n        \"label\": \"DigitalOcean contract length (days)\",\n        \"query\": \"1\",\n        \"current\": {\n          \"selected\": false,\n          \"text\": \"1\",\n          \"value\": \"1\"\n        },\n        \"options\": [\n          {\n            \"selected\": true,\n            \"text\": \"1\",\n            \"value\": \"1\"\n          }\n        ]\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 100,\n      \"type\": \"row\",\n      \"title\": \"DigitalOcean \u2014 cost (over selected range)\",\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Contract cost\",\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          }\n        }\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"vector($contract_cost)\"\n        }\n      ],\n      \"description\": \"Enter the contract's total cost and its length in days (from its date range); all panels derive the daily rate as cost / days.\"\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"Daily rate (contract)\",\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 1\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          }\n        }\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"vector(($contract_cost / $contract_days))\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Spend over selected range\",\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 1\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          }\n        }\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"vector(($contract_cost / $contract_days) * $__range_s / 86400)\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"stat\",\n      \"title\": \"$ / GPU-hour (list)\",\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 1\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 2,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"blue\"\n          }\n        }\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"mean\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"none\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"($contract_cost / $contract_days) / 24 / count(DCGM_FI_DEV_GPU_UTIL{fleet=\\\"digital-ocean\\\"})\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\