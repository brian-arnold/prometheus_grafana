# Nudges users to move burst-fleet dstack jobs onto idle RESERVED capacity, which
# we pay for whether or not it is used. Fires to #it-alerts via Alertmanager.
# See PLT-2190.
#
# This rule was previously live-only (created out-of-band 2026-07-22); committed
# here 2026-08-06 when Mithril was dropped from it, so a helm/kubectl reconcile
# can no longer silently lose it.
#
# 2026-08-06: Mithril removed from both sides of the comparison — the reservation
# ended 01:00 UTC that day, so its blocks no longer exist. Leaving `mithril.*` in
# the reservation sums made them evaluate over an empty set, and leaving it in the
# burst exclusion would have wrongly treated any future fleet named mithril* as
# reserved. DigitalOcean is now the only reservation fleet.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dstack-burst-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: dstack.burst.rules
      rules:
        - alert: BurstJobWhileReservationIdle
          expr: |
            (dstack_job_gpus{fleet!~"dig.*ocean.*"} > 0)
              <= on() group_left()
              (
                sum(dstack_instance_blocks_total{fleet=~"dig.*ocean.*"})
                - sum(dstack_instance_blocks_busy{fleet=~"dig.*ocean.*"})
              )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Burst GPU job `{{ $labels.run }}` could move onto idle reservation capacity
            description: |
              Job `{{ $labels.run }}` (user `{{ $labels.user }}`, {{ $value }} GPU(s)) is running on
              the burst fleet `{{ $labels.fleet }}` on host `{{ $labels.host }}`, but the reservation
              fleet (DigitalOcean) currently has idle GPU capacity that can hold it.
              We pay for the reservation fleet whether or not it is used, so please move this job
              off burst and onto the reservation fleet.
              Check current headroom on the dstack allocation dashboard (uid `dstack-fleet-alloc`) on at-grafana.
