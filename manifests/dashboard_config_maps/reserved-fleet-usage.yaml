          "options": { "reduceOptions": { "calcs": ["mean"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes{fleet=\"digital-ocean\"}) / sum(node_memory_MemTotal_bytes{fleet=\"digital-ocean\"}))" } ] },

        { "id": 7, "type": "stat", "title": "GPU · avg over range", "gridPos": { "h": 5, "w": 5, "x": 10, "y": 6 },
