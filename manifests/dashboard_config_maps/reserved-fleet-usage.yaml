# Reserved-fleet utilization (DigitalOcean) - the wall-TV kiosk dashboard, on
# at-grafana via the VictoriaMetrics datasource. Per-fleet current gauges + avg
# stats: CPU / Memory / GPU / GPU Memory / Usage Efficiency (= max of fleet-avg
# CPU and GPU - the bottleneck resource; added 2026-08-03) / GPU Reserved %.
# Previously live-only (no repo manifest); first committed here 2026-08-03 when
# the Mithril row was removed (fleet decommissioned 2026-08-06; pre-removal JSON
# archived in OpenTofu k8s/at/monitoring/dashboards/archive-mithril-2026-08-04/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: reserved-fleet-usage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Fleets"
