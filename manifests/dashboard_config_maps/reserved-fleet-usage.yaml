          "options": { "reduceOptions": { "calcs": ["mean"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\",fleet=\"digital-ocean\"}[5m])))" } ] },

