# Reserved-fleet utilization dashboard (DO + Mithril) on at-grafana, querying the
# VictoriaMetrics long-term store (do-metrics-consolidation). Per fleet: a CURRENT
# row (gauges, instant) of CPU / memory / GPU / GPU-memory / GPU-reserved-%
# utilization, and directly under it an AVERAGE row (stat+sparkline, mean over the
# selected time range) of the same five. VM is the only datasource with both fleets.
# uid kept stable so the morpho-master TV kiosk (/d/reserved-fleet-usage) needs no change.
# GPU Reserved % comes from the dstack-exporter's dstack_instance_gpus_busy/total
# (GPU-denominated — block size varies per fleet), excluding instances dstack marks
# unreachable (dstack_instance_unreachable == 1: dead nodes aren't real capacity).
# DO fleet regex dig.*ocean.* also matches the typo'd "digial-ocean-*" fleet names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reserved-fleet-usage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Fleets"
data:
  reserved-fleet-usage.json: |
    {
      "uid": "reserved-fleet-usage",
      "title": "Reserved Fleet Utilization (DO + Mithril)",
      "tags": ["fleets", "gpu", "reserved"],
      "schemaVersion": 39,
      "version": 6,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        { "id": 100, "type": "row", "title": "DigitalOcean", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },

        { "id": 1, "type": "gauge", "title": "CPU · current", "gridPos": { "h": 5, "w": 5, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 40 }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\",fleet=\"digital-ocean\"}[5m])))" } ] },

        { "id": 2, "type": "gauge", "title": "Memory · current", "gridPos": { "h": 5, "w": 5, "x": 5, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 40 }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes{fleet=\"digital-ocean\"}) / sum(node_memory_MemTotal_bytes{fleet=\"digital-ocean\"}))" } ] },

        { "id": 3, "type": "gauge", "title": "GPU · current", "gridPos": { "h": 5, "w": 5, "x": 10, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 40 }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "avg(DCGM_FI_DEV_GPU_UTIL{fleet=\"digital-ocean\"})" } ] },

        { "id": 4, "type": "gauge", "title": "GPU Memory · current", "gridPos": { "h": 5, "w": 5, "x": 15, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 40 }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * sum(DCGM_FI_DEV_FB_USED{fleet=\"digital-ocean\"}) / (sum(DCGM_FI_DEV_FB_USED{fleet=\"digital-ocean\"}) + sum(DCGM_FI_DEV_FB_FREE{fleet=\"digital-ocean\"}))" } ] },

        { "id": 22, "type": "gauge", "title": "GPU Reserved % · current", "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 40 }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "victoriametrics" }, "expr": "100 * sum((dstack_instance_gpus_busy{fleet=~\"dig.*ocean.*\"} and on(instance) dstack_instance_unreachable == 0)) / sum((dstack_instance_gpus_total{fleet=~\"dig.*ocean.*\"} and on(instance) dstack_instance_unreachable == 0))", "instant": true } ] },

        { "id": 5, "type": "stat", "title": "CPU · avg over range", "gridPos": { "h": 5, "w": 5, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
