data:
  morpho-node-utilization.json: "{\n  \"annotations\": {\n    \"list\": [\n      {\n        \"builtIn\": 1,\n        \"datasource\": {\n          \"type\": \"grafana\",\n          \"uid\": \"-- Grafana --\"\n        },\n        \"enable\": true,\n        \"hide\": true,\n        \"iconColor\": \"rgba(0, 211, 255, 1)\",\n        \"name\": \"Annotations & Alerts\",\n        \"type\": \"dashboard\"\n      }\n    ]\n  },\n  \"description\": \"Per-node utilization for the MORPHO k8s cluster, served from the VictoriaMetrics LTS (morpho Prometheus remote_writes with external label cluster=morpho). No GPU utilization yet: morpho runs HAMi but no dcgm-exporter, so only slot *requests* are shown.\",\n  \"editable\": true,\n  \"fiscalYearStartMonth\": 0,\n  \"graphTooltip\": 1,\n  \"id\": null,\n  \"links\": [],\n  \"liveNow\": false,\n  \"refresh\": \"1m\",\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"morpho\",\n    \"nodes\",\n    \"utilization\"\n  ],\n  \"templating\": {\n    \"list\": []\n  },\n  \"time\": {\n    \"from\": \"now-3h\",\n    \"to\": \"now\"\n  },\n  \"timepicker\": {},\n  \"timezone\": \"\",\n  \"title\": \"Morpho Cluster \\u2014 Node Utilization\",\n  \"uid\": \"morpho-node-util\",\n  \"version\": 1,\n  \"weekStart\": \"\",\n  \"panels\": [\n    {\n      \"id\": 10,\n      \"type\": \"stat\",\n      \"title\": \"Cluster CPU %\",\n      \"description\": \"Mean CPU utilization across all morpho node-exporter cores over the selected range.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * (1 - avg(label_replace(rate(node_cpu_seconds_total{mode=\\\"idle\\\",cluster=\\\"morpho\\\"}[$__range]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))))\",\n          \"instant\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              }\n            ]\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 11,\n      \"type\": \"stat\",\n      \"title\": \"Cluster Memory %\",\n      \"description\": \"1 - MemAvailable/MemTotal across morpho nodes, averaged over the selected range.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * (1 - sum(label_replace(avg_over_time(node_memory_MemAvailable_bytes{cluster=\\\"morpho\\\"}[$__range]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))) / sum(label_replace(avg_over_time(node_memory_MemTotal_bytes{cluster=\\\"morpho\\\"}[$__range]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))))\",\n          \"instant\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              }\n            ]\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 12,\n      \"type\": \"stat\",\n      \"title\": \"Cluster Network (RX+TX)\",\n      \"description\": \"Aggregate physical-interface throughput across morpho nodes over the selected range.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"sum(label_replace(rate(node_network_receive_bytes_total{device!~\\\"lo|veth.*|docker.*|br.*|cni.*|flannel.*|tap.*|cali.*|cilium.*|lxc.*\\\",cluster=\\\"morpho\\\"}[$__range]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))) + sum(label_replace(rate(node_network_transmit_bytes_total{device!~\\\"lo|veth.*|docker.*|br.*|cni.*|flannel.*|tap.*|cali.*|cilium.*|lxc.*\\\",cluster=\\\"morpho\\\"}[$__range]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"})))\",\n          \"instant\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\",\n          \"color\": {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 13,\n      \"type\": \"stat\",\n      \"title\": \"GPU slots requested %\",\n      \"description\": \"HAMi nvidia.com/gpu requests vs allocatable slots (NOT utilization \\u2014 no dcgm-exporter on morpho yet).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 4,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * sum(kube_pod_container_resource_requests{resource=\\\"nvidia_com_gpu\\\",cluster=\\\"morpho\\\"} * on(namespace,pod) group_left() max by(namespace,pod)(kube_pod_status_phase{phase=~\\\"Running|Pending\\\",cluster=\\\"morpho\\\"}==1)) / sum(kube_node_status_allocatable{resource=\\\"nvidia_com_gpu\\\",cluster=\\\"morpho\\\"})\",\n          \"instant\": false,\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"text\",\n                \"value\": null\n              }\n            ]\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\",\n      \"title\": \"CPU utilization % by node\",\n      \"description\": \"Per-node CPU %, node-exporter joined to kube_node_info for the k8s node name.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 - (avg by(node) (label_replace(rate(node_cpu_seconds_total{mode=\\\"idle\\\",cluster=\\\"morpho\\\"}[5m]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))) * 100)\",\n          \"legendFormat\": \"{{node}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"mean\",\n            \"lastNotNull\"\n          ]\n \
    \       }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"lineWidth\": 2\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 3,\n      \"type\": \"timeseries\",\n      \"title\": \"Memory utilization % by node\",\n      \"description\": \"1 - MemAvailable/MemTotal per node.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 4\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * (1 - avg by(node) (label_replace(node_memory_MemAvailable_bytes{cluster=\\\"morpho\\\"}, \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"})) / on(node) group_left() (avg by(node) (label_replace(node_memory_MemTotal_bytes{cluster=\\\"morpho\\\"}, \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))))))\",\n          \"legendFormat\": \"{{node}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"mean\",\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"lineWidth\": 2\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Network throughput by node (RX + / TX \\u2212)\",\n      \"description\": \"Physical interfaces only (virtual/CNI devices excluded).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 13\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"sum by(node) (label_replace(rate(node_network_receive_bytes_total{device!~\\\"lo|veth.*|docker.*|br.*|cni.*|flannel.*|tap.*|cali.*|cilium.*|lxc.*\\\",cluster=\\\"morpho\\\"}[5m]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"})))\",\n          \"legendFormat\": \"{{node}} rx\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"- sum by(node) (label_replace(rate(node_network_transmit_bytes_total{device!~\\\"lo|veth.*|docker.*|br.*|cni.*|flannel.*|tap.*|cali.*|cilium.*|lxc.*\\\",cluster=\\\"morpho\\\"}[5m]), \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"})))\",\n          \"legendFormat\": \"{{node}} tx\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"mean\",\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\",\n          \"color\": {\n            \"mode\": \"palette-classic\"\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"lineWidth\": 2\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\": \"Root filesystem usage % by node\",\n      \"description\": \"Used % of / on each node.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 13\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * (1 - avg by(node) (label_replace(node_filesystem_avail_bytes{mountpoint=\\\"/\\\",fstype!~\\\"tmpfs|overlay\\\",cluster=\\\"morpho\\\"}, \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"})) / on(node) group_left() (avg by(node) (label_replace(node_filesystem_size_bytes{mountpoint=\\\"/\\\",fstype!~\\\"tmpfs|overlay\\\",cluster=\\\"morpho\\\"}, \\\"internal_ip\\\", \\\"$1\\\", \\\"instance\\\", \\\"([^:]+):.*\\\") * on(internal_ip) group_left(node) (max by(internal_ip, node) (kube_node_info{cluster=\\\"morpho\\\"}))))))\",\n          \"legendFormat\": \"{{node}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"mean\",\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"lineWidth\": 2\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"id\": 21,\n      \"type\": \"timeseries\",\n      \"title\": \"Scheduling: requests vs allocatable %\",\n      \"description\": \"Requested CPU / memory / HAMi GPU slots of Running+Pending pods as % of cluster allocatable.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"victoriametrics\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 22\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * sum(kube_pod_container_resource_requests{resource=\\\"cpu\\\",cluster=\\\"morpho\\\"} * on(namespace,pod) group_left() max by(namespace,pod)(kube_pod_status_phase{phase=~\\\"Running|Pending\\\",cluster=\\\"morpho\\\"}==1)) / sum(kube_node_status_allocatable{resource=\\\"cpu\\\",cluster=\\\"morpho\\\"})\",\n          \"legendFormat\": \"cpu\",\n          \"refId\": \"A\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * sum(kube_pod_container_resource_requests{resource=\\\"memory\\\",cluster=\\\"morpho\\\"} * on(namespace,pod) group_left() max by(namespace,pod)(kube_pod_status_phase{phase=~\\\"Running|Pending\\\",cluster=\\\"morpho\\\"}==1)) / sum(kube_node_status_allocatable{resource=\\\"memory\\\",cluster=\\\"morpho\\\"})\",\n          \"legendFormat\": \"memory\",\n          \"refId\": \"B\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"victoriametrics\"\n          },\n          \"expr\": \"100 * sum(kube_pod_container_resource_requests{resource=\\\"nvidia_com_gpu\\\",cluster=\\\"morpho\\\"} * on(namespace,pod) group_left() max by(namespace,pod)(kube_pod_status_phase{phase=~\\\"Running|Pending\\\",cluster=\\\"morpho\\\"}==1)) / sum(kube_node_status_allocatable{resource=\\\"nvidia_com_gpu\\\",cluster=\\\"morpho\\\"})\",\n          \"legendFormat\": \"gpu slots\",\n          \"refId\": \"C\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"bottom\",\n          \"calcs\": [\n            \"mean\",\n            \"lastNotNull\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"color\": {\n            \"mode\": \"continuous-RdYlGr\"\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"showPoints\": \"never\",\n            \"lineWidth\": 2\n          },\n          \"min\": 0,\n          \"max\": 100\n        },\n        \"overrides\": []\n      }\n    }\n  ]\n}"
