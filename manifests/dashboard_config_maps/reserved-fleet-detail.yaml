# Reserved-fleet averages + per-node detail (DigitalOcean), on at-grafana via the
# VictoriaMetrics datasource (do-metrics-consolidation). DO averages -> DO
# per-node detail; groups by label `node` (ny2g2r*). Averages row includes
# Usage Efficiency = max(fleet-avg CPU, fleet-avg GPU) - the bottleneck resource
# (added 2026-08-03). Mithril sections removed 2026-08-03 (fleet decommissioned
# 2026-08-06; metric history kept in VM - pre-removal JSON archived in OpenTofu
# k8s/at/monitoring/dashboards/archive-mithril-2026-08-04/). Linked from the
# weekly Slack report; Teleport-gated via the at-grafana app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reserved-fleet-detail-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Fleets"
data:
  reserved-fleet-detail.json: |
